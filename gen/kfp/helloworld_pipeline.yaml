# PIPELINE DEFINITION
# Name: hello-world-pipeline
# Description: A hello world pipeline.
# Inputs:
#    arr: list
#    dct: dict
#    name: str
#    x: dict
# Outputs:
#    Output: str
components:
  comp-hello-world:
    executorLabel: exec-hello-world
    inputDefinitions:
      parameters:
        arr:
          parameterType: LIST
        dct:
          parameterType: STRUCT
        name:
          parameterType: STRING
        x:
          parameterType: STRUCT
    outputDefinitions:
      parameters:
        Output:
          parameterType: STRING
deploymentSpec:
  executors:
    exec-hello-world:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - hello_world
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.4.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"'  &&\
          \  python3 -m pip install --quiet --no-warn-script-location 'pydantic==1.8.2'\
          \ && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef hello_world(name: str, arr: list, dct: dict, x: dict) -> str:\n\
          \    from pydantic import BaseModel\n    class TestStruct(BaseModel):\n\
          \        a: int\n        b: str\n        c: list\n        d: dict\n\n  \
          \  def my_func(t: TestStruct):\n        print(t)\n        return t.a\n \
          \   xx = TestStruct(a=0, b=\"\", c=[], d={})\n    try:\n        xx = TestStruct.model_validate(x)\n\
          \    except Exception as e:\n        print(\"ERROR: TestStruct.model_validate\
          \ failed\")\n        print(e)\n        # x = TestStruct(a=0, b=\"\", c=[],\
          \ d={})\n    my_func(xx)\n    import os\n    print(f\"test secret: {os.environ['TESTOO']}\"\
          )\n    print(f'Hello {name}!')\n    print(f'len: {len(arr)} , arr: {arr}')\n\
          \    print(f'len: {len(dct)} , dct: {dct}')\n    return f'Hello {name}!'\n\
          \n"
        image: python:3.7
pipelineInfo:
  description: A hello world pipeline.
  name: hello-world-pipeline
root:
  dag:
    outputs:
      parameters:
        Output:
          valueFromParameter:
            outputParameterKey: Output
            producerSubtask: hello-world
    tasks:
      hello-world:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-hello-world
        inputs:
          parameters:
            arr:
              componentInputParameter: arr
            dct:
              componentInputParameter: dct
            name:
              componentInputParameter: name
            x:
              componentInputParameter: x
        taskInfo:
          name: hello-world
  inputDefinitions:
    parameters:
      arr:
        parameterType: LIST
      dct:
        parameterType: STRUCT
      name:
        parameterType: STRING
      x:
        parameterType: STRUCT
  outputDefinitions:
    parameters:
      Output:
        parameterType: STRING
schemaVersion: 2.1.0
sdkVersion: kfp-2.4.0
---
platforms:
  kubernetes:
    deploymentSpec:
      executors:
        exec-hello-world:
          secretAsEnv:
          - keyToEnv:
            - envVar: TESTOO
              secretKey: test
            secretName: kfp-secret
