[lint]
# explicit so the rule set does not depend on the ruff version's defaults
# (E4/E7/E9/F are ruff's historical default; I = isort)
select = ["E4", "E7", "E9", "F", "I"]
ignore = [
    "E402", # load_dotenv() intentionally runs before some imports across this repo
    "F403", # `from pkg.common.publisher import *` is an existing intentional pattern
    "F405", # follows from F403 above
]
