name: Lint

on:
  push:
    branches:
      - "*"

jobs:
  lint:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5

      - name: Install tools
        run: python -m pip install black==25.1.0 ruff==0.16.5

      # Same target developers run locally: black --check, ruff check, bash -n.
      - name: make check
        run: make check PYTHON=python
