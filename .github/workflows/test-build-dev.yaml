name: Lint

on:
  push:
    branches:
      - "*"

jobs:
  lint:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5

      - name: Install tools
        run: pip install black ruff

      - name: Check formatting (black)
        run: black --check .

      - name: ruff check
        run: ruff check .
