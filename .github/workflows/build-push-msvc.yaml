name: Build and Publish ML pipeline microservices

on:
  workflow_dispatch:
    inputs:
        service:
            description: 'Service to build and publish'
            required: true
            type: choice
            options:
                - blast
                - evotune
                - fittop
                - mutation

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
        contents: read
        packages: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
        
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
        
    - name: Login to Docker Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ secrets.IMAGE_REPO }}
        username: ${{ secrets.REGISTRY_USERNAME }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    
    - name: Get short commit SHA
      run: |
        export SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-8)
        echo "SHORT_SHA=${SHORT_SHA}" >> ${GITHUB_ENV}
        
    - name: Build and push
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./projects/${{ inputs.service }}/docker/microservice.Dockerfile
        push: true
        tags: ${{ secrets.IMAGE_REPO }}/${{ secrets.REGISTRY_USERNAME }}/ml-${{ inputs.service }}:${{ env.SHORT_SHA }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

